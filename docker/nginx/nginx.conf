user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 4096; multi_accept on; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/manifest+json webmanifest; image/avif avif; text/javascript mjs; }

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent" cache=$upstream_cache_status';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30;
  server_tokens off;
  client_body_timeout 60s;
  send_timeout 120s;

  # Compression (important on slow mobile connections)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript application/ld+json application/manifest+json image/svg+xml;

  # Rate limiting (per client IP)
  limit_req_zone $binary_remote_addr zone=pages:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:20m rate=15r/s;
  limit_req_zone $binary_remote_addr zone=downloads:20m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:20m;

  # Micro-cache for anonymous public pages and API responses
  proxy_cache_path /var/cache/nginx/edushare levels=1:2 keys_zone=edushare:50m max_size=2g inactive=24h use_temp_path=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/nginx/conf.d/*.conf;
}
